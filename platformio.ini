; CatLaser — лазерная игрушка для кошки. Два профиля устройства:
;   d1_mini  — ESP8266, Wemos D1 mini
;   esp32dev — ESP32 DevKit
; Профиль выбирается внизу в VS Code (значок "Switch PlatformIO Project Environment")
; или ключом -e:  pio run -e esp32dev -t upload
;
; Загрузка на новое устройство — два шага (для любого профиля):
;   1) pio run -e <профиль> -t upload      — прошивка (код)
;   2) pio run -e <профиль> -t uploadfs    — веб-интерфейс (папка data/ -> файловая система LittleFS)
; Веб-интерфейс правится в data/ без пересборки кода: изменил -> uploadfs.
; Внимание: uploadfs стирает всю файловую систему, в том числе сохранённую статистику.
; Настройки хранятся отдельно (EEPROM / NVS) и uploadfs их не затрагивает.

[platformio]
default_envs = d1_mini        ; какой профиль активен по умолчанию; поменяй на esp32dev, если работаешь в основном с ним

; ---------- общее для обоих профилей ----------
[env]
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    tzapu/WiFiManager@^2.0.17
    knolleary/PubSubClient@^2.8

; ---------- ESP8266: Wemos D1 mini ----------
[env:d1_mini]
platform = espressif8266
board = d1_mini
board_build.ldscript = eagle.flash.4m1m.ld   ; 4 МБ: 1 МБ под файловую систему
upload_speed = 921600
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

; ---------- ESP32: DevKit ----------
[env:esp32dev]
platform = espressif32@^6.9.0                ; Arduino-ESP32 2.0.x; код совместим и с ядром 3.x (pioarduino)
board = esp32dev
upload_speed = 921600
monitor_filters = esp32_exception_decoder
lib_deps =
    ${env.lib_deps}
    madhephaestus/ESP32Servo@^3.0.5

; Обновление по воздуху (после первой прошивки по USB), для любого профиля, работает и для кода, и для uploadfs:
;upload_protocol = espota
;upload_port = catlaser.local
